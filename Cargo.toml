[package]
name = "discord-only-dpi"
version = "0.9.3"
edition = "2021"
description = "Discord-only DPI bypass utility for Windows"
repository = "https://github.com/rouny-alsayad/DiscordOnlyDPI"
readme = "README.md"
keywords = ["discord", "dpi", "windows", "proxy", "rust"]

[dependencies]
brotli = "8"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tar = "0.4"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[build-dependencies]
winres = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
