changelog:
  exclude:
    labels:
      - ignore-for-release
      - dependencies
  categories:
    - title: 🚀 Features
      labels:
        - feature
        - enhancement
    - title: 🐛 Fixes
      labels:
        - bug
        - fix
    - title: 🛠 Maintenance
      labels:
        - maintenance
        - refactor
        - documentation
    - title: 📦 Other Changes
      labels:
        - "*"
